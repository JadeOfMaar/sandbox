// "Fusion" drives
@PART[KA_Engine_625_02]:NEEDS[KarbonitePlus,SystemHeat]
{
	refVolume = 18
	systemPower = 2455
}
@PART[KA_Engine_125_02]:NEEDS[KarbonitePlus,SystemHeat]
{
	refVolume = 147
	systemPower = 9818
}
@PART[KA_Engine_250_02]:NEEDS[KarbonitePlus,SystemHeat]
{
	refVolume = 1080
	systemPower = 39273
}
@PART[KA_Engine_125_02|KA_Engine_250_02|KA_Engine_625_02]:NEEDS[KarbonitePlus,SystemHeat]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/refVolume$
		moduleID = engine
		iconName = Icon_Atom
	}
	MODULE
	{
		name = ModuleSystemHeatEngine
		moduleID = engine1
		systemHeatModuleID = engine
		engineModuleID = basicEngine
		systemPower = #$/systemPower$
		systemOutletTemperature = 1200
		shutdownTemperature = 1500
		temperatureCurve
		{
			key = 1200 1 0 0
			key = 1900 0 0 0
		}
	}
}

